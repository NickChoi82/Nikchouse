<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMR + 메모/그림판/계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef0f2;color:#111;font-family:Arial,"Noto Sans KR",sans-serif}
.app{display:flex;gap:10px;align-items:flex-start;width:max-content;margin:10px auto;padding:0 8px}
.card{background:#fff;border:1px solid #111;border-radius:12px;overflow:hidden}
.omr{width:275px;height:825px;display:flex;flex-direction:column}
.omr-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:11px 10px;border-bottom:1px solid #ddd}
.omr-head h1{font-size:17px;margin:0}
.subject-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px 8px;border-bottom:1px solid #ddd}
.subject-tab{height:30px;font-size:10px;font-weight:700;padding:0 2px;white-space:nowrap}
.subject-tab.active{background:#171717;color:#fff}
button{font:inherit;cursor:pointer;background:#fff;border:1px solid #111;border-radius:6px}
.reset{padding:7px 10px}
#sheet{padding:6px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-gutter:stable}
.row{display:grid;grid-template-columns:30px repeat(5,32px);justify-content:center;align-items:center;gap:3px;padding:7px 4px;margin:5px 0;border-radius:8px;box-shadow:0 1px 6px #0002}
.num{text-align:center;font-weight:700}
.choice{width:32px;height:34px}
.choice.selected{background:#111;color:#fff;font-weight:700}
.omr-foot{flex:0 0 auto;padding:10px;border-top:1px solid #ddd;font-size:13px}
#answers{margin-top:7px;line-height:1.6;color:#444}
.answer-groups{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:12px;row-gap:2px;margin-top:4px}
.answer-groups .grp-range{color:#888;font-size:11px;align-self:center;text-align:right}
.answer-groups .grp-digits{font-family:Consolas,"Courier New",monospace;font-size:17px;font-weight:700;letter-spacing:4px;color:#111}
.answer-groups .grp-empty{color:#bbb}
/* 채점 후: 내 마킹을 5개씩 보여주고 틀린 것만 빨간 X + 아래 작은 글씨로 정답 */
.answer-groups.graded{row-gap:9px}
.answer-groups.graded .grp-digits{letter-spacing:0;display:flex;gap:6px}
.grp-d{position:relative;display:inline-block;width:14px;text-align:center}
.grp-d.x::after{content:'✕';position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);color:#e0262b;font-size:19px;font-weight:400;opacity:.85;font-family:Arial,sans-serif;pointer-events:none}
.grp-d.x .grp-key{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:10px;color:#e0262b;font-weight:800;line-height:1}
.grade-scores{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.grade-score{border:1px solid #ddd;border-radius:6px;padding:3px 0;text-align:center;font-size:10px;line-height:1.3;cursor:pointer;background:#fff}
.grade-score b{display:block;font-size:14px}
.grade-score.active{border-color:#111;background:#171717;color:#fff}

.tools{width:400px;display:flex;flex-direction:column;gap:14px}
.toolbox{padding:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{height:40px;font-weight:700}
.tab.active{background:#171717;color:#fff}
.tooltop{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px;min-height:34px}
#note{width:100%;height:255px;border:0;outline:0;resize:none;padding:4px;font:15px Arial}
#drawWrap{display:none}
.draw-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
#canvas{display:block;width:100%;height:255px;border-top:1px solid #eee;touch-action:none;background:#fff}
.clear{padding:7px 10px}

.calc{padding:12px}
.calc-title{font-size:14px;margin:3px 0 10px}
#display{width:100%;height:56px;border:1px solid #d9e0e7;border-radius:6px;background:#f7f9fb;text-align:right;padding:8px 12px;font-size:24px;margin-bottom:6px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.key{height:48px;border-color:#d9e0e7;font-size:16px}
.zero{grid-column:span 2}
@media(max-width:720px){.app{margin-left:0}.tools{width:360px}}

.timerbar{
  width:100%;background:#fff;border:1px solid #111;border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;justify-content:center;
  gap:10px;margin-bottom:10px
}
.timer-label{font-weight:700}
#timerDisplay{font-size:24px;font-weight:700;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.timerbtn{padding:7px 11px}
#alarmMsg{font-size:13px;font-weight:700;display:none}
.submit-wrap{padding:8px 10px;border-top:1px solid #ddd;display:flex;gap:7px}
.submit-btn{flex:1;padding:9px 6px;font-weight:700;background:#171717;color:#fff}
.cancel-grade-btn{padding:9px 8px}
.key-entry-btn{padding:9px 8px;font-weight:700;white-space:nowrap}
.grading-title{font-size:13px;font-weight:700;margin:0 0 6px}
.grading-help{font-size:11px;color:#555;margin-bottom:5px}
.row.correct{outline:2px solid #17823b;background:#eefaf1}
.row.wrong{outline:2px solid #c62828;background:#fff1f1}
.row.unanswered{outline:2px solid #e59a00;background:#fff9e8}
.choice.answer-key{box-shadow:inset 0 0 0 2px #17823b}
#gradeResult{padding:8px 10px;border-top:1px solid #ddd;font-size:12px;line-height:1.55;display:none}
#gradeResult b{font-size:14px}

.answer-modal{position:fixed;inset:0;background:#0008;z-index:9999;display:none;align-items:center;justify-content:center;padding:12px}
.answer-modal.open{display:flex}
.answer-panel{width:min(94vw,390px);height:min(94vh,860px);background:#fff;border:1px solid #111;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.answer-head{padding:12px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:8px}
.answer-head h2{font-size:17px;margin:0}
.answer-panel{height:auto !important;max-height:94vh}
#keyTyping{padding:10px 12px;overflow-y:auto;flex:1}
.kt-help{font-size:11px;color:#666;margin-bottom:8px;line-height:1.5}
.kt-row{border:1px solid #ddd;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.kt-row.active{border-color:#111;box-shadow:0 1px 6px #0002}
.kt-row.done{border-color:#17823b}
.kt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kt-name{font-weight:800;font-size:14px;background:none;border:0;padding:0}
.kt-count{font-size:12px;font-weight:700;color:#888}
.kt-row.done .kt-count{color:#17823b}
.kt-input{width:100%;height:38px;border:1px solid #bbb;border-radius:6px;padding:0 10px;font:700 18px Consolas,"Courier New",monospace;letter-spacing:3px;outline:none}
.kt-input:focus{border-color:#111}
.kt-preview{margin-top:6px;font:700 14px Consolas,"Courier New",monospace;letter-spacing:2px;color:#111;display:flex;gap:12px;flex-wrap:wrap}
.kt-preview .grp-empty{color:#ccc}
.answer-subject-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px;border-bottom:1px solid #ddd}
.answer-subject-tab{height:32px;font-size:10px;font-weight:700;padding:0 2px}
.answer-subject-tab.active{background:#171717;color:#fff}
#answerSheet{padding:6px;overflow:auto;flex:1}
.answer-row{display:grid;grid-template-columns:30px repeat(5,32px);justify-content:center;align-items:center;gap:3px;padding:7px 4px;margin:5px 0;border-radius:8px;box-shadow:0 1px 6px #0002}
.answer-choice{width:32px;height:34px}
.answer-choice.selected{background:#111;color:#fff;font-weight:700}
.answer-modal-foot{padding:10px;border-top:1px solid #ddd}
.answer-status{font-size:12px;line-height:1.5;margin-bottom:8px;color:#444}
.answer-actions{display:flex;gap:7px}
.answer-actions button{padding:10px 8px;font-weight:700}
#gradeFromModal{flex:1;background:#171717;color:#fff}

/* OMR 접힘 전용 슬림 모드 */
body.omr-collapsed .app{
  width:100%;
  max-width:430px;
  margin:8px auto;
  padding:0 8px;
  display:block;
}
body.omr-collapsed .tools{
  width:100%;
  gap:10px;
}
body.omr-collapsed > div:first-of-type{
  width:100% !important;
  max-width:430px;
  margin:8px auto 0 !important;
  padding:0 8px !important;
}
body.omr-collapsed .timerbar{
  width:100%;
  padding:8px;
  gap:6px;
  justify-content:space-between;
  flex-wrap:wrap;
}
body.omr-collapsed .timer-label{display:none}
body.omr-collapsed #timerDisplay{
  font-size:24px;
  min-width:70px;
}
body.omr-collapsed .timerbtn{
  padding:7px 8px;
  white-space:nowrap;
}
body.omr-collapsed #slimShowOMR{
  display:inline-block !important;
}
body.omr-collapsed .toolbox,
body.omr-collapsed .calc{
  width:100%;
}
body.omr-collapsed #note{
  height:260px;
}
body.omr-collapsed #canvas{
  height:260px;
}
body.omr-collapsed #showOMRFloating{
  display:none !important;
}
body.omr-collapsed #alarmMsg{
  width:100%;
  text-align:center;
}

#slimShowOMR{display:none}

@media(max-width:470px){
  body.omr-collapsed .timerbar{
    display:grid;
    grid-template-columns:72px 1fr 1fr 1fr;
    align-items:center;
  }
  body.omr-collapsed #timerDisplay{grid-column:1}
  body.omr-collapsed #timerStart{grid-column:2}
  body.omr-collapsed #timerPause{grid-column:3}
  body.omr-collapsed #timerReset{grid-column:4}
  body.omr-collapsed #slimShowOMR{
    grid-column:1 / -1;
    width:100%;
  }
  body.omr-collapsed #alarmMsg{grid-column:1 / -1}
}


.omr-head-actions{display:flex;align-items:stretch;justify-content:flex-end;gap:5px;margin-left:6px}
.area-reset{min-width:82px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:11px;font-weight:700}
.area-reset span:last-child{font-size:13px;margin-top:3px}
.omr-hide-btn{min-width:62px;padding:4px 5px;font-size:10px;font-weight:700;white-space:nowrap}

/* 접힌 상태: 시험지 옆에 두기 좋은 초컴팩트 상단바 */
body.omr-collapsed > div:first-of-type{
  width:100% !important;
  max-width:430px;
  margin:6px auto 0 !important;
  padding:0 6px !important;
}
body.omr-collapsed .timerbar{
  display:flex !important;
  flex-wrap:nowrap !important;
  align-items:center;
  justify-content:flex-start;
  width:100%;
  min-height:44px;
  margin:0;
  padding:5px 6px;
  gap:5px;
  border-radius:9px;
}
body.omr-collapsed #timerDisplay{
  flex:0 0 auto;
  min-width:65px;
  font-size:22px;
  line-height:1;
  text-align:center;
}
body.omr-collapsed .timerbtn{
  flex:0 0 auto;
  height:32px;
  padding:4px 7px;
  font-size:12px;
  font-weight:700;
  border-radius:6px;
  white-space:nowrap;
}
body.omr-collapsed #timerStart{padding-left:8px;padding-right:8px}
body.omr-collapsed #slimShowOMR{
  display:inline-block !important;
  margin-left:auto;
  width:auto !important;
}
body.omr-collapsed #alarmMsg{
  position:absolute;
  top:54px;
  left:50%;
  transform:translateX(-50%);
  width:auto;
  white-space:nowrap;
  background:#fff;
  border:1px solid #111;
  border-radius:6px;
  padding:4px 7px;
  z-index:20;
}
body.omr-collapsed .app{
  margin-top:7px;
}

/* 이전 좁은 화면 grid 배치를 무효화 */
@media(max-width:470px){
  body.omr-collapsed .timerbar{
    display:flex !important;
    grid-template-columns:none !important;
  }
  body.omr-collapsed #timerDisplay,
  body.omr-collapsed #timerStart,
  body.omr-collapsed #timerPause,
  body.omr-collapsed #timerReset,
  body.omr-collapsed #slimShowOMR,
  body.omr-collapsed #alarmMsg{
    grid-column:auto !important;
  }
}


/* 버튼 타이포그래피 통일 — 기존 레이아웃/크기는 유지 */
button,
.timerbtn,
.reset,
.subject-tab,
.tab,
.clear,
.key,
.submit-btn,
.cancel-grade-btn,
.answer-subject-tab,
.answer-choice,
#closeAnswerModal,
#clearAnswerSubject,
#gradeFromModal,
#slimShowOMR{
  font-family:Arial,"Noto Sans KR",sans-serif;
  font-weight:700;
  letter-spacing:-0.15px;
}

/* 주요 일반 버튼 */
.timerbtn,
.reset,
.clear,
#closeAnswerModal,
#clearAnswerSubject,
#gradeFromModal{
  font-size:12px;
}

/* 탭류 */
.tab{
  font-size:13px;
}
.subject-tab,
.answer-subject-tab{
  font-size:10px;
}

/* OMR 숫자 선택 버튼 */
.choice,
.answer-choice{
  font-size:13px;
  font-weight:700;
}

/* 제출/채점 관련 */
.submit-btn,
.cancel-grade-btn{
  font-size:12px;
}

/* 계산기는 숫자 가독성을 위해 크기는 기존 수준 유지 */
.key{
  font-size:16px;
  font-weight:700;
}

/* 상단 OMR 헤더 버튼도 동일한 굵기감 */
.area-reset,
.area-reset span,
.omr-hide-btn{
  font-weight:700;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

/* 접힌 상태에서도 같은 타이포 규칙 */
body.omr-collapsed .timerbtn,
body.omr-collapsed #slimShowOMR{
  font-size:12px;
  font-weight:700;
}


/* 로고 + 제작자 이메일: 기존 UI 안에 컴팩트하게 통합 */
.brand-logo{
  flex:0 0 auto;
  width:48px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-right:7px;
  margin-right:1px;
  border-right:1px solid #d7d7d7;
}
.brand-logo img{
  display:block;
  max-width:40px;
  max-height:27px;
  width:auto;
  height:auto;
  object-fit:contain;
}
.creator-email{
  position:fixed;
  right:10px;
  bottom:5px;
  z-index:50;
  font:700 9px Arial,"Noto Sans KR",sans-serif;
  color:#777;
  background:rgba(238,240,242,.88);
  padding:2px 4px;
  border-radius:4px;
  pointer-events:none;
}

/* 접힌 슬림 모드에서도 로고를 타이머 왼쪽에 유지하되 더 작게 */
body.omr-collapsed .brand-logo{
  width:31px;
  height:27px;
  padding-right:5px;
  margin-right:0;
}
body.omr-collapsed .brand-logo img{
  max-width:25px;
  max-height:22px;
}
body.omr-collapsed .creator-email{
  font-size:8px;
  right:6px;
  bottom:3px;
}


/* ===== 참고 사진 기반 도구 영역 디자인 ===== */
.tools{gap:0}
.toolbox{
  padding:10px 12px 8px;
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
  border-bottom:0;
}
.tabs{
  display:flex;
  align-items:center;
  gap:18px;
  margin:0 0 8px;
  border-bottom:1px solid #e2e5e9;
}
.tab{
  width:auto;
  height:32px;
  padding:0 2px;
  border:0;
  border-radius:0;
  background:transparent;
  color:#777;
  font-size:12px;
}
.tab.active{
  background:transparent;
  color:#111;
  border-bottom:2px solid #111;
}
.tooltop{
  min-height:28px;
  margin:-35px 0 7px;
  pointer-events:none;
}
.tooltop .clear{
  pointer-events:auto;
  padding:5px 10px;
  border:0;
  border-radius:14px;
  background:#3a3a3d;
  color:#fff;
  font-size:10px;
}
#note{
  height:250px;
  padding:8px 4px;
  border:0;
  background:#fff;
  font:13px Arial,"Noto Sans KR",sans-serif;
}
.draw-controls{
  min-height:28px;
  margin:-35px 0 7px;
  padding-left:95px;
  justify-content:flex-end;
  gap:6px;
  font-size:10px;
}
.draw-controls .clear{
  padding:5px 10px;
  border:0;
  border-radius:14px;
  background:#3a3a3d;
  color:#fff;
  font-size:10px;
}
#canvas{
  height:250px;
  border:0;
  background:#fff;
}

.calc{
  padding:10px 12px 12px;
  border-top-left-radius:0;
  border-top-right-radius:0;
  border-top:1px solid #e2e5e9;
}
.calc-title{
  margin:0 0 10px;
  font-size:12px;
  font-weight:700;
}
#display{
  height:42px;
  margin-bottom:7px;
  padding:6px 10px;
  border:1px solid #e3e6ea;
  border-radius:3px;
  background:#fafbfc;
  font-size:17px;
}
.keys{
  gap:2px;
  background:#f1f2f4;
}
.key{
  height:39px;
  border:0;
  border-radius:2px;
  background:#f5f6f8;
  font-size:13px;
}
.key:hover{background:#eceef1}
.key.equal-key{
  background:#343438;
  color:#fff;
}
.key.equal-key:hover{background:#29292d}
.zero{grid-column:auto}

/* 접힌 모드에서도 사진 같은 한 패널 느낌 유지 */
body.omr-collapsed .tools{gap:0}
body.omr-collapsed .toolbox{border-bottom-left-radius:0;border-bottom-right-radius:0}
body.omr-collapsed .calc{border-top-left-radius:0;border-top-right-radius:0}


/* v8 도구 영역 디테일 */
.toolbox{padding-bottom:16px}
.tabs{margin-bottom:16px}
.tooltop{margin:-43px 0 16px;min-height:30px;align-items:flex-start}
.draw-controls{
  margin:-43px 0 16px;
  padding-left:105px;
  min-height:30px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
}
.pen-size-control{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:10px;color:#444}
.pen-size-control input[type="range"]{width:110px}
#clearCanvas{flex:0 0 auto}

/* 메모/그림판과 계산기 사이에 참고 이미지처럼 여백 */
.calc{margin-top:28px;padding-top:15px}
.calc-title{margin-bottom:8px}

/* 최근 계산 3개 표시 공간 */
.calc-history{
  height:66px;
  margin:0 0 8px;
  padding:4px 9px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:2px;
  overflow:hidden;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
.history-empty{margin:auto 0 3px;text-align:right;font-size:10px;color:#aaa}
.history-row{min-height:16px;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:10px;color:#777;white-space:nowrap}
.history-row span{overflow:hidden;text-overflow:ellipsis}
.history-row strong{min-width:50px;text-align:right;font-size:11px;color:#444}
body.omr-collapsed .calc{margin-top:22px}


/* ===== v9 requested alignment fixes ===== */

/* 메모/그림판 + 계산기를 다시 하나의 연속된 카드처럼 연결 */
.tools{
  gap:0 !important;
  border:1px solid #111;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}
.toolbox{
  border:0 !important;
  border-radius:0 !important;
  padding:10px 12px 12px !important;
}
.calc{
  border:0 !important;
  border-top:1px solid #e1e4e8 !important;
  border-radius:0 !important;
  margin-top:0 !important;
  padding:18px 12px 12px !important;
}

/* 메모 탭 제목과 전체 지우기 버튼을 같은 높이로 */
.tabs{
  height:34px;
  margin:0 0 10px !important;
  align-items:flex-start;
}
.tab{
  height:34px;
  line-height:30px;
}
.tooltop{
  height:34px;
  min-height:34px !important;
  margin:-44px 0 10px !important;
  align-items:flex-start !important;
}
.tooltop .clear{

<script>
// OMR 표시/숨기기
const omrSection = document.querySelector('.omr');
const toggleOMRBtn = document.getElementById('toggleOMR');
let omrHidden = false;

toggleOMRBtn.onclick = () => {
  omrHidden = true;
  omrSection.style.display = 'none';
  document.body.classList.add('omr-collapsed');
  document.getElementById('slimShowOMR').textContent = 'OMR';
  document.getElementById('showOMRFloating').style.display = 'none';
};
function restoreOMR(){
  omrHidden = false;
  omrSection.style.display = 'flex';
  document.body.classList.remove('omr-collapsed');
  document.getElementById('showOMRFloating').style.display = 'none';
}
document.getElementById('showOMRFloating').onclick = restoreOMR;
document.getElementById('slimShowOMR').onclick = restoreOMR;


// OMR - 5개 영역별 20문제 답안 독립 저장 + 제출 후 정답 OMR 입력/채점
const N=20;
const subjects=['언어이해','자료해석','창의수리','언어추리','수열추리'];
// 모의고사 회차(1~10회차)마다 내 답안/제출 답안/정답/진행 상태를 따로 저장
const ROUNDS=8; // 0~6: 1~7회차, 7: 일반(정답 직접 입력)
const GENERAL=7;
function roundLabel(r){ return r===GENERAL?'일반':(r+1)+'회차'; }
function emptyBySubject(){ return Object.fromEntries(subjects.map(name=>[name,Array(N).fill(null)])); }
const rounds=Array.from({length:ROUNDS},()=>({
 subjectAnswers:emptyBySubject(), submittedAnswers:emptyBySubject(), answerKeys:emptyBySubject(), mode:'solve'
}));
let activeRound=0;

// 독끝 SKCT 모의고사 정답표 (과목 순서: 언어이해, 자료해석, 창의수리, 언어추리, 수열추리)

function presetKey(r){
 const rows=PRESET_KEYS[r+1];
 if(!rows) return null;
 return Object.fromEntries(subjects.map((name,i)=>[name,[...rows[i].replace(/\s/g,'')].map(Number)]));
}

let answerKeys=rounds[0].answerKeys;

function getActiveArray(){

 activeSubject=name; answers=getActiveArray(); current=0;
 document.querySelectorAll('.subject-tab').forEach(b=>b.classList.toggle('active',b===button));

 document.querySelectorAll('.grade-score').forEach(c=>c.classList.toggle('active',c.dataset.s===name));

 if(mode==='solve') omrTitle.textContent=activeSubject+' · 20문제';
 else if(mode==='key') omrTitle.textContent=activeSubject+' · 정답 입력';
 else omrTitle.textContent=activeSubject+' · 채점 결과';
}
function renderSelections(){
 answers=getActiveArray();
 [...sheet.children].forEach((row,q)=>row.querySelectorAll('.choice').forEach((b,i)=>{
   b.classList.toggle('selected',answers[q]===i+1);
   b.classList.remove('answer-key');
 }));
}
function select(q,c){
 if(mode==='graded') return;
 answers=getActiveArray();
 const wasFull=answers.every(Boolean);
 const sameChoice=answers[q]===c; answers[q]=sameChoice?null:c;
 [...sheet.children[q].querySelectorAll('.choice')].forEach((b,i)=>b.classList.toggle('selected',!sameChoice&&i+1===c));
 current=sameChoice?q:Math.min(q+1,N-1); updateOMR();
 if(mode==='solve' && !wasFull && !sameChoice && activeSubject===subjects[subjects.length-1] && answers.every(Boolean)){
   setTimeout(()=>{
     if(mode!=='solve') return;
     if(hasKeys()){ if(confirm('수열추리까지 마킹 완료! 지금 '+roundLabel(activeRound)+' 채점할까요?')) autoGrade(); }
     else if(confirm('수열추리까지 마킹 완료! 정답을 입력하고 채점할까요?')) enterKeyMode();
   },50);
 }
}
function updateOMR(){
 answers=getActiveArray();
 count.textContent=answers.filter(Boolean).length;
 const hasAny=answers.some(Boolean);
 if(mode==='solve'){ if(hasAny) answerBox.innerHTML=groupedAnswers(answers); else answerBox.textContent='아직 선택한 답이 없습니다.'; }
 else if(mode==='key'){ if(hasAny) answerBox.innerHTML='정답 입력'+groupedAnswers(answers); else answerBox.textContent='정답을 OMR 방식으로 체크하세요.'; }
 else answerBox.innerHTML=`<b>${activeSubject}</b> 내 마킹 <span style="color:#e0262b;font-size:11px">✕오답 · 빨간 숫자=정답</span>`+groupedAnswers(submittedAnswers[activeSubject],answerKeys[activeSubject]);
}
// 체크한 답을 5문항씩 묶어 한 줄로 표시 (예: 1-5  12235), 미응답은 -
function groupedAnswers(arr,key){
 let html='<div class="answer-groups'+(key?' graded':'')+'">';
 for(let i=0;i<arr.length;i+=5){
   const digits=arr.slice(i,i+5).map((a,j)=>{
     const d=a?String(a):'<span class="grp-empty">-</span>';
     if(!key) return d;
     const k=key[i+j], wrong=a!==k;
     return `<span class="grp-d${wrong?' x':''}">${d}${wrong&&k?`<span class="grp-key">${k}</span>`:''}</span>`;
   }).join('');
   html+=`<span class="grp-range">${i+1}-${Math.min(i+5,arr.length)}</span><span class="grp-digits">${digits}</span>`;
 }
 return html+'</div>';
}
function allFilled(obj){
 return subjects.every(s=>obj[s].every(Boolean));
}
function missingSummary(obj){
 return subjects.map(s=>{
   const miss=obj[s].map((v,i)=>v?null:i+1).filter(Boolean);
   return miss.length ? `${s}: ${miss.join(', ')}번` : null;
 }).filter(Boolean).join('\n');
}
// 정답표가 있는 회차이거나, 일반에서 정답을 모두 입력해 둔 경우
function hasKeys(){ return !!presetKey(activeRound) || allFilled(answerKeys); }
function autoGrade(){
 const preset=presetKey(activeRound);
 if(preset) subjects.forEach(s=>{answerKeys[s]=preset[s];});
 if(!allFilled(answerKeys)) return false;
 grade();
 return true;
}
function enterKeyMode(){
 if(autoGrade()) return;
 // 체크하지 않은 공란도 그대로 제출하며, 채점 시 오답으로 처리
 subjects.forEach(s=>submittedAnswers[s]=subjectAnswers[s].slice());
 mode='key';
 gradeResult.style.display='none';
 openAnswerModal(activeSubject);
}
function grade(){
 if(!allFilled(answerKeys)){
   alert('정답을 모두 입력해야 채점할 수 있습니다.\n\n'+missingSummary(answerKeys));
   return;
 }
 document.getElementById('answerModal').classList.remove('open');
 subjects.forEach(s=>submittedAnswers[s]=subjectAnswers[s].slice());
 mode='graded'; answers=subjectAnswers[activeSubject];
 submitBtn.textContent='처음부터 다시';
 cancelGradeBtn.style.display='none';
 updateTitle(); renderSelections(); updateOMR(); renderGradeMarks(); showGradeResult();
 saveHistoryRecord(); updateKeyEntryBtn();
}
function clearGradeMarks(){
 [...sheet.children].forEach(row=>row.classList.remove('correct','wrong','unanswered'));
 sheet.querySelectorAll('.choice').forEach(b=>b.classList.remove('answer-key'));
}
function renderGradeMarks(){
 clearGradeMarks();
 if(mode!=='graded') return;
 const mine=submittedAnswers[activeSubject], key=answerKeys[activeSubject];
 [...sheet.children].forEach((row,q)=>{
   if(!mine[q]) row.classList.add('unanswered');
   else if(mine[q]===key[q]) row.classList.add('correct');
   else row.classList.add('wrong');
   if(key[q]) row.querySelectorAll('.choice')[key[q]-1].classList.add('answer-key');
 });
}
function showGradeResult(){
 let totalCorrect=0, total=subjects.length*N;
 const cells=subjects.map(s=>{
   let correct=0;
   for(let i=0;i<N;i++) if(submittedAnswers[s][i]===answerKeys[s][i]) correct++;
   totalCorrect+=correct;
   return `<div class="grade-score${s===activeSubject?' active':''}" data-s="${s}">${s}<b>${correct}</b></div>`;
 });
 gradeResult.innerHTML=`<div class="grading-title">${roundLabel(activeRound)} 채점 결과: <b>${totalCorrect}/${total}</b></div>
 <div class="grade-scores">${cells.join('')}</div>`;
 gradeResult.style.display='block';
 // 과목 점수를 누르면 해당 과목 OMR/마킹 결과로 이동
 gradeResult.querySelectorAll('.grade-score').forEach(c=>c.onclick=()=>{
   const tab=[...document.querySelectorAll('.subject-tab')].find(b=>b.textContent===c.dataset.s);
   if(tab) tab.click();
 });
}

// ===== 분석표: 채점할 때마다 날짜/회차/과목별 점수 기록 (브라우저에 저장) =====
const HISTORY_KEY='skct_score_history_v1';
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]; }catch(e){ return []; } }
function storeHistory(list){ try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(list)); }catch(e){ alert('기록 저장에 실패했습니다. (브라우저 저장소 사용 불가)'); } }
function saveHistoryRecord(){
 const scores={}, wrong={};
 subjects.forEach(s=>{
   wrong[s]=[]; let c=0;
   for(let i=0;i<N;i++){ if(submittedAnswers[s][i]===answerKeys[s][i]) c++; else wrong[s].push(i+1); }
   scores[s]=c;
 });
 const list=loadHistory();
 list.push({id:Date.now(), date:new Date().toISOString(), round:roundLabel(activeRound), scores, wrong,
   total:subjects.reduce((n,s)=>n+scores[s],0)});
 storeHistory(list);
}
function fmtDate(iso,withTime){
 const d=new Date(iso), p=n=>String(n).padStart(2,'0');
 const day=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
 return withTime?`${day} ${p(d.getHours())}:${p(d.getMinutes())}`:day;
}
const historyModal=document.getElementById('historyModal');

['전체',...Array.from({length:ROUNDS},(_,r)=>roundLabel(r))].forEach(v=>{

['총점',...subjects].forEach(v=>{

document.getElementById('exportHistory').onclick=()=>{

 const rows=list.map(r=>[fmtDate(r.date,true),r.round,...subjects.map(s=>r.scores[s]),r.total,...subjects.map(s=>'"'+r.wrong[s].join(' ')+'"')]);

 a.download='SKCT_점수기록_'+fmtDate(new Date().toISOString())+'.csv';
 a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
function deleteHistory(id){
 if(!confirm('이 기록을 삭제할까요?')) return;
 storeHistory(loadHistory().filter(r=>r.id!==id)); renderHistory();
}
function historyChartSVG(list,metric){
 const W=860,H=230,L=36,R=14,T=16,B=44;
 const max=metric==='총점'?subjects.length*N:N;
 const vals=list.map(r=>metric==='총점'?r.total:r.scores[metric]);
 const n=vals.length;
 const x=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1);
 const y=v=>T+(1-v/max)*(H-T-B);
 let g='';
 for(let k=0;k<=4;k++){
   const v=Math.round(max*k/4), yy=y(v);
   g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#eee"/><text x="${L-6}" y="${yy+4}" font-size="11" text-anchor="end" fill="#888">${v}</text>`;
 }
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 let marks='';
 const step=Math.ceil(n/12);
 vals.forEach((v,i)=>{
   marks+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#c63b3d"><title>${fmtDate(list[i].date,true)} · ${list[i].round} · ${v}점</title></circle>`;
   marks+=`<text x="${x(i)}" y="${y(v)-9}" font-size="11" font-weight="700" text-anchor="middle" fill="#111">${v}</text>`;
   if(i%step===0||i===n-1){
     const d=new Date(list[i].date);
     marks+=`<text x="${x(i)}" y="${H-B+16}" font-size="10" text-anchor="middle" fill="#666">${d.getMonth()+1}/${d.getDate()}</text>`;
     marks+=`<text x="${x(i)}" y="${H-B+29}" font-size="10" text-anchor="middle" fill="#999">${list[i].round}</text>`;
   }
 });
 return `<svg id="historyChart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${metric} 점수 추이">${g}
  <polyline points="${pts}" fill="none" stroke="#c63b3d" stroke-width="2.5" stroke-linejoin="round"/>${marks}</svg>`;
}
function renderHistory(){
 const all=loadHistory().sort((a,b)=>a.date<b.date?-1:1);
 const rf=historyRound.value, metric=historyMetric.value;
 const list=rf==='전체'?all:all.filter(r=>r.round===rf);
 if(!list.length){
   historyContent.innerHTML=`<div class="history-empty-msg">${all.length?'선택한 회차의 기록이 없습니다.':'아직 기록이 없습니다.<br>시험을 채점하면 여기에 자동으로 기록됩니다.'}</div>`;
   return;
 }
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const totals=list.map(r=>r.total);
 const best=Math.max(...totals), last=list[list.length-1];
 const prev=list.length>1?list[list.length-2]:null;
 const diff=prev?last.total-prev.total:null;
 const cards=`<div class="history-cards">
   <div class="history-card"><div class="label">응시 횟수</div><div class="value">${list.length}<small> 회</small></div></div>
   <div class="history-card"><div class="label">평균 총점</div><div class="value">${avg(totals).toFixed(1)}<small> / 100</small></div></div>
   <div class="history-card"><div class="label">최고 점수</div><div class="value">${best}<small> / 100</small></div></div>
   <div class="history-card"><div class="label">최근 점수 (${last.round})</div><div class="value">${last.total}<small>${diff===null?'':(diff>=0?' ▲'+diff:' ▼'+(-diff))}</small></div></div>
 </div>`;
 const subAvg=subjects.map(s=>avg(list.map(r=>r.scores[s])));
 const minAvg=Math.min(...subAvg);
 const bars=`<div class="history-section-title">과목별 평균 (20점 만점 · 주황 = 가장 약한 과목)</div><div class="history-bars">`+
   subjects.map((s,i)=>`<div>${s}</div><div class="track"><div class="fill${subAvg[i]===minAvg?' weak':''}" style="width:${subAvg[i]/N*100}%"></div></div><div class="num">${subAvg[i].toFixed(1)} / 20</div>`).join('')+`</div>`;
 const chart=`<div class="history-section-title">${metric} 점수 추이</div>`+historyChartSVG(list,metric);
 const rows=[...list].reverse().map(r=>`<tr class="${r.total===best?'best':''}">
   <td>${fmtDate(r.date,true)}</td><td>${r.round}</td>
   ${subjects.map(s=>`<td title="틀린 문제: ${r.wrong[s].length?r.wrong[s].join(', ')+'번':'없음'}">${r.scores[s]}</td>`).join('')}
   <td class="total">${r.total}</td><td><button class="del" data-id="${r.id}">삭제</button></td></tr>`).join('');
 const table=`<div class="history-section-title">응시 기록 (과목 점수에 마우스를 올리면 틀린 문제 번호가 보입니다)</div>
   <div class="history-table-wrap"><table class="history-table"><thead><tr><th>날짜</th><th>회차</th>${subjects.map(s=>`<th>${s}</th>`).join('')}<th>총점</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
 historyContent.innerHTML=cards+bars+chart+table;
 historyContent.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteHistory(+b.dataset.id));
}

// 과목별로 정답을 숫자로 한 번에 타이핑 (예: 12134513245421314521)
const keyTyping=document.getElementById('keyTyping');
keyTyping.innerHTML='<div class="kt-help">과목 이름을 누르고 정답 20개를 숫자로 이어서 입력하세요. (1~5만 입력, 띄어쓰기 무시)<br>20개를 채우면 다음 과목으로 자동 이동하고, Enter로도 넘어갈 수 있어요.</div>'+
  subjects.map((s,i)=>`<div class="kt-row" data-s="${s}"><div class="kt-top"><button class="kt-name">${s}</button><span class="kt-count"></span></div>
  <input class="kt-input" data-i="${i}" inputmode="numeric" autocomplete="off" placeholder="정답 20개 숫자 입력"></div>`).join('');
const ktInputs=[...keyTyping.querySelectorAll('.kt-input')];
function ktKeyString(s){ return answerKeys[s].map(v=>v||'').join(''); }
function ktRender(){
  keyTyping.querySelectorAll('.kt-row').forEach((row,i)=>{
    const s=subjects[i], arr=answerKeys[s], n=arr.filter(Boolean).length;
    row.classList.toggle('active',s===answerActiveSubject);
    row.classList.toggle('done',n===N);
    row.querySelector('.kt-count').textContent=`${n} / ${N}${n===N?' ✓':''}`;
    const inp=row.querySelector('.kt-input');
    if(document.activeElement!==inp){ const v=arr.every((x,j)=>j>=n||x)?ktKeyString(s):arr.map(x=>x||'?').join(''); inp.value=v.replace(/(.{5})(?=.)/g,'$1 '); }
  });
}
ktInputs.forEach((inp,i)=>{
  const s=subjects[i];
  inp.addEventListener('focus',()=>{ answerActiveSubject=s; renderAnswerKey(); });
  inp.addEventListener('input',()=>{
    const digits=inp.value.replace(/[^1-5]/g,'').slice(0,N);
    const formatted=digits.replace(/(.{5})(?=.)/g,'$1 ');
    if(inp.value!==formatted) inp.value=formatted;
    answerKeys[s].fill(null);
    [...digits].forEach((d,j)=>answerKeys[s][j]=+d);
    renderAnswerKey(); updateKeyEntryBtn();
    if(digits.length===N && i<ktInputs.length-1) ktInputs[i+1].focus();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); if(i<ktInputs.length-1) ktInputs[i+1].focus(); else document.getElementById('gradeFromModal').focus(); }
  });
});
keyTyping.querySelectorAll('.kt-name').forEach((b,i)=>b.onclick=()=>ktInputs[i].focus());

function renderAnswerKey(){
  ktRender();
  const arr=answerKeys[answerActiveSubject];
  answerModalTitle.textContent='정답 입력 · '+answerActiveSubject;
  [...answerSheet.children].forEach((row,q)=>{
    row.querySelectorAll('.answer-choice').forEach((b,i)=>b.classList.toggle('selected',arr[q]===i+1));
  });
  const done=arr.filter(Boolean).length;
  answerStatus.textContent=`${answerActiveSubject} 정답: ${done} / 20 · 전체 정답을 입력한 뒤 채점하세요.`;
}
document.getElementById('clearAnswerSubject').onclick=()=>{
  answerKeys[answerActiveSubject].fill(null); answerCurrent=0;
  const inp=ktInputs[subjects.indexOf(answerActiveSubject)]; inp.value=''; renderAnswerKey(); updateKeyEntryBtn(); inp.focus();
};
document.getElementById('closeAnswerModal').onclick=()=>{
  answerModal.classList.remove('open');
  mode='solve'; answers=getActiveArray(); renderSelections(); updateOMR(); updateKeyEntryBtn();
};
document.getElementById('gradeFromModal').onclick=grade;

// 정답 창이 열려 있을 때 1~5 키는 정답 OMR에 입력
document.addEventListener('keydown',e=>{
  if(!answerModal.classList.contains('open')) return;
  if(e.target.classList?.contains('kt-input')) return;
  if(/^[1-5]$/.test(e.key)){
    e.preventDefault(); e.stopImmediatePropagation();
    selectAnswerKey(answerCurrent,+e.key);
  }
}, true);

// 키보드 1~5는 메모장/계산기 입력 중에는 OMR 작동 안 함
document.addEventListener('keydown',e=>{
 if(document.activeElement===document.getElementById('note')) return;
 if(document.activeElement===document.getElementById('display') || document.activeElement?.closest?.('.calc')) return;
 if(answerModal.classList.contains('open') || historyModal.classList.contains('open')) return;
 if(mode==='solve' && /^[1-5]$/.test(e.key)) select(current,+e.key);

// 메모장/그림판 탭
const noteTab=document.getElementById('noteTab'),drawTab=document.getElementById('drawTab');
const noteWrap=document.getElementById('noteWrap'),drawWrap=document.getElementById('drawWrap');
const noteControls=document.getElementById('noteControls'),drawControls=document.getElementById('drawControls');
noteTab.onclick=()=>{noteTab.classList.add('active');drawTab.classList.remove('active');noteWrap.style.display='block';drawWrap.style.display='none';noteControls.style.display='flex';drawControls.style.display='none'};
drawTab.onclick=()=>{drawTab.classList.add('active');noteTab.classList.remove('active');drawWrap.style.display='block';noteWrap.style.display='none';noteControls.style.display='none';drawControls.style.display='flex';resizeCanvas()};
document.getElementById('clearNote').onclick=()=>document.getElementById('note').value='';

// 그림판
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),size=document.getElementById('penSize');
let drawing=false,last=null;
function resizeCanvas(){
 const r=canvas.getBoundingClientRect();
 const newW=Math.max(1,Math.round(r.width*devicePixelRatio));
 const newH=Math.max(1,Math.round(r.height*devicePixelRatio));
 if(canvas.width===newW && canvas.height===newH) return;
 const old=document.createElement('canvas');
 old.width=canvas.width; old.height=canvas.height;
 old.getContext('2d').drawImage(canvas,0,0);
 canvas.width=newW; canvas.height=newH;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.lineCap='round'; ctx.lineJoin='round';
 if(old.width && old.height){
   ctx.save();
   ctx.setTransform(1,0,0,1,0,0);
   ctx.drawImage(old,0,0,old.width,old.height,0,0,newW,newH);
   ctx.restore();
 }
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle='#111';ctx.lineWidth=+size.value;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
size.oninput=()=>document.getElementById('sizeText').textContent=size.value+'px';
document.getElementById('clearCanvas').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
// 초기 상태: 메모장 컨트롤만 표시
noteControls.style.display='flex';
drawControls.style.display='none';


// 계산기
const display=document.getElementById('display'); let expr='';
const calcHistoryEl=document.getElementById('calcHistory');
let calcHistory=[];
function renderCalcHistory(){
 if(!calcHistory.length){calcHistoryEl.innerHTML='<div class="history-empty">최근 계산 기록</div>';return}
 calcHistoryEl.innerHTML=calcHistory.slice(-3).map(h=>'<div class="history-row"><span>'+h.expression+'</span><strong>'+h.result+'</strong></div>').join('');
}
renderCalcHistory();
function render(){display.value=expr||'0'}

function calcInput(v){
 if(v==='AC'){expr='';render();return}
 if(v==='C' || v==='BACK'){expr=expr.slice(0,-1);render();return}
 if(v==='SQRT'){try{const n=Number(Function('"use strict";return ('+(expr||'0')+')')());if(n<0||!Number.isFinite(n))throw 0;expr=String(Math.sqrt(n));}catch{expr='오류'}render();return}
 if(v==='±'){if(expr) expr=expr.startsWith('-')?expr.slice(1):'-('+expr+')';render();return}
 if(v==='='){
   const original=expr;
   try{
     const safe=expr.replace(/%/g,'/100');
     if(!/^[0-9+\-*/().\s]+$/.test(safe)) throw 0;
     expr=String(Function('"use strict";return ('+safe+')')());
     if(expr==='Infinity'||expr==='NaN') throw 0;
     if(original){
       calcHistory.push({expression:original.replace(/\*/g,'×').replace(/\//g,'÷'),result:expr});
       if(calcHistory.length>3) calcHistory=calcHistory.slice(-3);
       renderCalcHistory();
     }
   }catch{expr='오류'}
   render();return
 }
 if(expr==='오류') expr='';
 expr+=v;render();
}

document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{
 display.focus();
 calcInput(k.dataset.v);
});

// 계산기 영역을 클릭하면 키보드 입력을 계산기로 전환
document.querySelector('.calc').addEventListener('mousedown',()=>{
 setTimeout(()=>display.focus(),0);
});

// 일반 숫자키 + 오른쪽 번호키(Numpad) 지원
document.addEventListener('keydown',e=>{
 const calcActive = document.activeElement===display || document.activeElement?.closest?.('.calc');
 if(!calcActive) return;

 let v=null;
 if(/^\d$/.test(e.key)) v=e.key;
 else if(/^Numpad\d$/.test(e.code)) v=e.code.replace('Numpad','');
 else if(e.key==='+' || e.code==='NumpadAdd') v='+';
 else if(e.key==='-' || e.code==='NumpadSubtract') v='-';
 else if(e.key==='*' || e.code==='NumpadMultiply') v='*';
 else if(e.key==='/' || e.code==='NumpadDivide') v='/';
 else if(e.key==='.' || e.code==='NumpadDecimal') v='.';
 else if(e.key==='%') v='%';
 else if(e.key==='(' || e.key===')') v=e.key;
 else if(e.key==='Enter' || e.code==='NumpadEnter' || e.key==='=') v='=';
 else if(e.key==='Backspace' || e.key==='Delete') v='C';
 else if(e.key==='Escape') v='AC';

 if(v!==null){
   e.preventDefault();
   e.stopImmediatePropagation();
   calcInput(v);
 }
}, true);


// 15분 타이머 + Web Audio 알람
let timerRemaining = 15 * 60;
let timerRunning = false;
let timerEnd = null;
let timerInterval = null;
let timerPhase = 'work'; // work: 15분 영역, break: 1분 쉬는시간
let completedWorkSessions = 0; // 완료된 15분 영역 수

const timerDisplay = document.getElementById('timerDisplay');
const alarmMsg = document.getElementById('alarmMsg');

function drawTimer(){
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  timerDisplay.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function stopTimerLoop(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function soundAlarm(){
  alarmMsg.style.display = 'inline';
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ac = new AudioCtx();
    const now = ac.currentTime;
    // 6회의 짧은 비프음
    for(let i=0;i<6;i++){
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = (i % 2 === 0) ? 880 : 660;
      gain.gain.setValueAtTime(0.0001, now + i*0.32);
      gain.gain.exponentialRampToValueAtTime(0.28, now + i*0.32 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.32 + 0.22);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(now + i*0.32); osc.stop(now + i*0.32 + 0.24);
    }
  }catch(e){
    alert(timerPhase === 'work' ? '15분이 끝났습니다!' : '쉬는시간 1분이 끝났습니다!');
  }
}
function tickTimer(){
  if(!timerRunning) return;
  timerRemaining = Math.max(0, Math.ceil((timerEnd - Date.now())/1000));
  drawTimer();
  if(timerRemaining <= 0){
    timerRunning = false;
    stopTimerLoop();
    soundAlarm();

    // 1~4번째 영역 뒤에는 1분 휴식, 5번째(수열추리) 종료 후에는 시험 종료
    if(timerPhase === 'work'){
      completedWorkSessions++;
      if(completedWorkSessions >= 5){
        timerRemaining = 0;
        document.querySelector('.timer-label').textContent = '시험 종료';
        drawTimer();
        if(mode==='solve') enterKeyMode();
        return;
      }
      timerPhase = 'break';
      timerRemaining = 60;
      document.querySelector('.timer-label').textContent = '쉬는시간 1분';
    } else {
      timerPhase = 'work';
      timerRemaining = 15 * 60;
      document.querySelector('.timer-label').textContent = '15분 타이머';
    }

    drawTimer();
    setTimeout(() => {
      alarmMsg.style.display = 'none';
      timerRunning = true;
      timerEnd = Date.now() + timerRemaining * 1000;
      timerInterval = setInterval(tickTimer, 200);
      tickTimer();
    }, 0);
  }
}
document.getElementById('timerStart').onclick = () => {
  if(timerRunning || timerRemaining <= 0) return;
  alarmMsg.style.display = 'none';
  timerRunning = true;
  timerEnd = Date.now() + timerRemaining*1000;
  stopTimerLoop();
  timerInterval = setInterval(tickTimer, 200);
  tickTimer();
};
document.getElementById('timerPause').onclick = () => {
  if(!timerRunning) return;
  timerRemaining = Math.max(0, Math.ceil((timerEnd - Date.now())/1000));
  timerRunning = false;
  stopTimerLoop();
  drawTimer();
};
document.getElementById('timerReset').onclick = () => {
  timerRunning = false;
  stopTimerLoop();
  timerPhase = 'work';
  completedWorkSessions = 0;
  timerRemaining = 15*60;
  document.querySelector('.timer-label').textContent = '15분 타이머';
  alarmMsg.style.display = 'none';
  drawTimer();
};
drawTimer();
